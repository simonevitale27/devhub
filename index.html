<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub - Interactive Dev Playground</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="DevHub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Piattaforma interattiva per SQL, Python e Data Analysis. Esercizi pratici, editor live, grafici professionali e strumenti di analisi dati."
    />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;500;700;900&family=Chewy&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind is now compiled at build time (see tailwind.config.js + index.css),
         no longer loaded from cdn.tailwindcss.com. -->
  </head>
  <body
    class="min-h-screen overflow-x-hidden antialiased selection:bg-blue-500 selection:text-white"
  >
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("DevHub SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("DevHub SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
